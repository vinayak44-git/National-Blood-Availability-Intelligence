<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaktSetu — Portal Authentication & Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/portals.css">
    <style>
        .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .login-card { background: var(--cream-card); border: 1px solid var(--cream-border); border-radius: 24px; width: min(460px, 100%); overflow: hidden; box-shadow: var(--shadow-lg); }
        .login-header { background: linear-gradient(135deg, var(--blood-dark) 0%, var(--blood-red) 60%, var(--blood-accent) 100%); padding: 32px; color: #fff; text-align: center; }
        .login-body { padding: 32px; }
        .field-group { margin-bottom: 18px; }
        .field-group label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
        .field-group input, .field-group select { width: 100%; padding: 12px 14px; border: 1px solid var(--cream-border); border-radius: 10px; font-size: 13px; font-weight: 600; background: var(--cream-bg); color: var(--text-dark); }
        .field-group input:focus { border-color: var(--blood-accent); outline: none; background: #fff; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, var(--blood-accent), var(--blood-red)); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(192,24,43,0.3); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(192,24,43,0.45); }
        .quick-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .chip-btn { background: var(--cream-bg); border: 1px solid var(--cream-border); padding: 10px; border-radius: 10px; font-size: 11px; font-weight: 700; color: var(--text-dark); cursor: pointer; text-align: center; transition: 0.2s; }
        .chip-btn:hover { background: var(--blood-light); border-color: var(--blood-accent); color: var(--blood-accent); }
    </style>
</head>
<body>
    <div class="ambient"></div>

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-header">
                <div style="font-size:36px;margin-bottom:8px">🩸</div>
                <h1 style="font-family:Outfit,sans-serif;font-size:26px;font-weight:900" data-i18n="login_title">Account Sign In</h1>
                <p style="font-size:12px;opacity:0.85;margin-top:4px" data-i18n="login_sub">Select your role or click a 1-click test credential to access RaktSetu portals.</p>
            </div>

            <div class="login-body">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
                    <span style="font-size:11px;font-weight:800;color:var(--text-muted)">SELECT LANGUAGE</span>
                    <select class="lang-selector" style="background:var(--cream-bg);border:1px solid var(--cream-border);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--text-dark)">
                        <option value="en">🌐 English</option>
                        <option value="hi">🇮🇳 हिन्दी</option>
                        <option value="ta">🇮🇳 தமிழ்</option>
                        <option value="te">🇮🇳 తెలుగు</option>
                        <option value="bn">🇮🇳 বাংলা</option>
                        <option value="mr">🇮🇳 मराठी</option>
                    </select>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="field-group">
                        <label>Role</label>
                        <select id="roleInput" required>
                            <option value="requester">🏥 Requester (Doctor / Hospital)</option>
                            <option value="dispatcher">⚡ Dispatcher (Control Room)</option>
                            <option value="provider">🏬 Provider (Blood Bank)</option>
                            <option value="patient">📱 Patient / Relative</option>
                        </select>
                    </div>

                    <div class="field-group">
                        <label>Username</label>
                        <input type="text" id="userInput" placeholder="e.g. requester1" required>
                    </div>

                    <div class="field-group">
                        <label>Password</label>
                        <input type="password" id="passInput" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-submit" data-i18n="login_title">Sign In →</button>
                </form>

                <div style="margin-top:24px;border-top:1px solid var(--cream-border);padding-top:18px">
                    <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px">1-CLICK TEST CREDENTIALS</div>
                    <div class="quick-chips">
                        <div class="chip-btn" onclick="fillQuick('requester1', 'Requester@123', 'requester')">🏥 Requester</div>
                        <div class="chip-btn" onclick="fillQuick('dispatcher1', 'Dispatcher@123', 'dispatcher')">⚡ Dispatcher</div>
                        <div class="chip-btn" onclick="fillQuick('provider1', 'Provider@123', 'provider')">🏬 Provider</div>
                        <div class="chip-btn" onclick="fillQuick('patient1', 'Patient@123', 'patient')">📱 Patient</div>
                    </div>

                    <a href="/demo" style="display:block;text-align:center;margin-top:14px;background:var(--cream-bg);border:1px solid var(--blood-accent);color:var(--blood-accent);padding:10px;border-radius:10px;font-weight:700;font-size:12px;text-decoration:none;" data-i18n="quick_demo">🎮 Launch Demo Mode (No Login Required)</a>

                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px dashed var(--cream-border);font-size:12px">
                        <span style="color:var(--text-muted)">New to RaktSetu?</span>
                        <a href="/register" style="color:var(--blood-accent);font-weight:800;text-decoration:none">Create an Account / Register →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script>
        function fillQuick(u, p, r) {
            document.getElementById('userInput').value = u;
            document.getElementById('passInput').value = p;
            document.getElementById('roleInput').value = r;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;
            const r = document.getElementById('roleInput').value;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p, role: r})
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || 'Login failed');
                    return;
                }

                if (r === 'dispatcher') window.location.href = '/dashboard';
                else if (r === 'requester') window.location.href = '/requester';
                else if (r === 'provider') window.location.href = '/provider';
                else if (r === 'patient') window.location.href = '/patient';
            } catch(ex) {
                alert('Network error: ' + ex.message);
            }
        }
    </script>
</body>
</html>
